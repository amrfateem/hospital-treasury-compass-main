[package]
name = "alrahma-hospital"
version = "0.3.0"
description = "Al-Rahma Hospital treasury and accounting system"
authors = ["Al-Rahma Hospital"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Printing"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
